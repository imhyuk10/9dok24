<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 480px; height: 280px;
  background: #F7F8FB;
  border: 1px solid #DFE2E9;
  font-family: 'Pretendard Variable', Pretendard, 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; user-select: none; -webkit-app-region: drag;
}

.logo-area {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}

.mark { width: 56px; height: 56px; }

.brand {
  font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', monospace;
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
  color: #14181f;
}
.brand span { color: #1F42C1; }

.loader {
  margin-top: 30px;
  width: 140px; height: 2px;
  background: #E3E6EC;
  border-radius: 2px; overflow: hidden;
}
.loader-bar {
  width: 40%; height: 100%;
  background: #1F42C1;
  border-radius: 2px;
  animation: slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.version {
  position: absolute; bottom: 14px; right: 18px;
  font-family: ui-monospace, monospace;
  font-size: 10px; color: #9AA1AE;
}

@keyframes slide {
  0% { transform: translateX(-70px); }
  100% { transform: translateX(180px); }
}
</style>
</head>
<body>
  <div class="logo-area">
    <img class="mark" src="./9dok24_icon.png" alt="" />
    <div class="brand">9DOK<span>24</span></div>
  </div>
  <div class="loader"><div class="loader-bar"></div></div>
  <div class="version">v1.0.0</div>
</body>
</html>
